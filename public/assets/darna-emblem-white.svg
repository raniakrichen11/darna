             C 60 38, 68 36, 72 38
             C 70 45, 63 48, 58 46 Z"
          fill="#FFFFFF" />

    <!-- Leaf 2 (Middle leaf) -->
    <path d="M 52 56
             C 56 50, 64 51, 67 54
             C 64 60, 57 60, 52 56 Z"
          fill="#FFFFFF" />

    <!-- Leaf 3 (Lower leaf) -->
    <path d="M 48 66
             C 52 62, 59 63, 62 67
             C 58 72, 52 71, 48 66 Z"
          fill="#FFFFFF" />
  </svg>